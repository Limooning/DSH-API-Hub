name: release

# Builds the plugin tarball and attaches it to a GitHub Release.
# Runs when a version tag is pushed, or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check syntax
        run: |
          node --check plugin/lib/server.mjs
          node --check plugin/lib/index.js
          node --check plugin/lib/client.js

      - name: Pack the plugin
        run: |
          mkdir -p dist
          cd plugin
          npm pack --pack-destination ../dist
          ls -l ../dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tgz \
            --title "$TAG" \
            --generate-notes \
            --notes "Install: \`pnpm add <the .tgz asset>\` from this release, or link the repository's \`plugin/\` directory." \
            || gh release upload "$TAG" dist/*.tgz --clobber
