name: Feature request
description: 想要的功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）

  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过的（可选）
